- name: Send email notification
  if: always()
  uses: dawidd6/action-send-mail@v3
  with:
    server_address: ${{ secrets.SMTP_SERVER }}
    server_port: ${{ secrets.SMTP_PORT }}
    username: ${{ secrets.SMTP_USERNAME }}
    password: ${{ secrets.SMTP_PASSWORD }}
    secure: false
    subject: GitHub Actions Result - Note Taking API
    to: srengty@gmail.com
    from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
    body: |
      Dear Teacher,

      The Note-Taking Application API automated test workflow has finished.

      Repository: ${{ github.repository }}
      Branch: ${{ github.ref_name }}
      Committer: ${{ github.actor }}
      Workflow status: ${{ job.status }}

      The project includes:
      - User authentication
      - Protected Note CRUD operations
      - Folder organization
      - Sharing status
      - Search functionality
      - Automated e2e tests
      - GitHub Actions CI email notification

      This email was sent automatically by GitHub Actions after running the automated test suite.

      Best regards,
      Nut Sophaphirum